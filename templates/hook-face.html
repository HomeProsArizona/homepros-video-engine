<!doctype html><html lang="es"><head><meta charset="utf-8"><style>/*FONTS*//*BASE*/
/* Hook drawn OVER Josh (transparent page). Face stays clear in the upper half; text lives in the lower half,
   inside the 3:4 Instagram grid crop (y 240..1680). */
html,body{background:transparent}
.shade{position:absolute;left:0;right:0;bottom:0;height:1060px;background:linear-gradient(to bottom,rgba(11,11,12,0) 0%,rgba(11,11,12,.55) 30%,rgba(11,11,12,.88) 62%,rgba(11,11,12,.94) 100%)}
.top{position:absolute;left:72px;right:72px;top:270px;display:flex;justify-content:space-between;align-items:center}
.top .logo{font-size:60px;text-shadow:0 4px 18px rgba(0,0,0,.45)}
.chip{font-size:28px;color:var(--gold);background:rgba(11,11,12,.62);border:3px solid rgba(253,191,0,.6);padding:14px 24px;border-radius:99px;white-space:nowrap}
.head{position:absolute;left:72px;right:72px;top:1010px}
.kicker{font-size:30px;color:var(--soft);margin-bottom:34px;display:flex;align-items:center;gap:24px}
.kicker:before{content:"";width:64px;height:3px;background:var(--soft)}
.ln{display:block;overflow:hidden;line-height:1.08;padding-bottom:6px}
.ln>span{display:inline-block;white-space:nowrap;font-size:var(--hs,120px);font-weight:900;letter-spacing:-.035em;color:var(--white);text-shadow:0 6px 26px rgba(0,0,0,.5);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.ln:nth-child(2)>span{animation-delay:.12s}.ln:nth-child(3)>span{animation-delay:.24s}.ln:nth-child(4)>span{animation-delay:.36s}.ln:nth-child(5)>span{animation-delay:.48s}
.ln:first-of-type>span{animation:none}
</style></head><body>
<div class="shade"></div>
<div class="top">
  <div class="logo"><span class="mark"></span><span class="wm">Home<b>Pros</b></span></div>
  <div class="chip mono">{{CHIP}}</div>
</div>
<div class="head"><div class="kicker mono">{{KICKER}}</div>{{LINES}}</div>
<script>
window.seek=function(ms){document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms});};
(function(){var spans=[...document.querySelectorAll('.ln>span')],max=1080-144,s=120;
 document.documentElement.style.setProperty('--hs',s+'px');
 document.fonts.ready.then(function(){var w=Math.max(...spans.map(x=>x.getBoundingClientRect().width));
  if(w>max){s=Math.floor(s*max/w);document.documentElement.style.setProperty('--hs',s+'px');}
  window.__ready=true;});})();
</script></body></html>

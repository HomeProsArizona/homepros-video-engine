<!doctype html><html lang="es"><head><meta charset="utf-8"><style>/*FONTS*//*BASE*/
html,body{background:transparent}
.card{position:absolute;left:48px;right:48px;bottom:300px;display:flex;align-items:center;justify-content:space-between;gap:30px;padding:30px 40px;border-radius:44px;
  background:rgba(11,11,12,.55);border:3px solid rgba(255,255,255,.18)}
.name{font-size:44px;font-weight:800;color:#fff}
.name small{display:block;font-size:26px;color:rgba(255,255,255,.7);margin-top:8px}
.card .logo{font-size:58px}
.card .logo .mark{width:24px;height:24px;border-radius:5px;box-shadow:12px 12px 0 var(--gold);margin-right:10px}
.live{position:absolute;top:150px;left:56px;font-size:28px;display:flex;align-items:center;gap:18px;color:#fff;
  background:rgba(11,11,12,.45);padding:14px 26px;border-radius:99px}
.live:before{content:"";width:18px;height:18px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 8px rgba(20,126,251,.3)}
/* COVER mode: taller, solid bar placed over captions burned into some avatar footage */
.cover .card{bottom:455px;height:250px;box-sizing:border-box;padding:0 48px;background:#0b0b0c;border-color:rgba(255,255,255,.22)}
.cover .name{font-size:54px}
.cover .name small{font-size:30px;margin-top:10px}
.cover .card .logo{font-size:70px}
</style></head><body class="{{CARD_MODE}}">
<div class="live mono">{{LIVE}}</div>
<div class="card">
  <div class="name">Josh Marquez<small class="mono">Designated Broker</small></div>
  <div class="logo"><span class="mark"></span><span class="wm">Home<b>Pros</b></span></div>
</div>
<script>document.fonts.ready.then(()=>{window.__ready=true});</script>
</body></html>
